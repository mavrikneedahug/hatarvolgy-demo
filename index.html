  <body>
    <div id="app"></div>
    <script>
      // A rescue for a page that never draws (lesson HV-068): if a script file fails to load, or the game
      // has not drawn in 10 s, drop the offline copy and the service worker once and load afresh. If it still
      // does not draw, say so instead of a white screen. Plain old script: it must run where the game does not.
      (function () {
        var KEY = "hv-rescued";
        function drawn() { var a = document.getElementById("app"); return a && a.firstElementChild; }
        function rescue() {
          if (drawn()) return;
          try { if (sessionStorage.getItem(KEY)) return tell(); sessionStorage.setItem(KEY, "1"); } catch (e) { return tell(); }
          var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
          sw.then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
            .then(function () { location.reload(); }, function () { location.reload(); });
        }
        function tell() {
          var a = document.getElementById("app");
          if (a && !drawn()) a.innerHTML = '<p style="padding:24px;font:18px/1.5 Georgia,serif;color:#ede6d6">A játék nem tudott elindulni ezen a böngészőn. Frissítsd a telefon rendszerét, vagy nyisd meg Chrome-ban.</p>';
        }
        window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") rescue(); }, true);
        setTimeout(rescue, 10000);
      })();
    </script>
  </body>
